# Piano B: Render (gratis ma si addormenta dopo 15 min senza visite e il disco NON è persistente).
# Imposta KEEPALIVE_URL = indirizzo del servizio (es. https://grokbot-solana.onrender.com) per tenerlo sveglio,
# SETUP_PIN per il PIN e WALLET_ENC_JSON per il backup cifrato del wallet.
services:
  - type: web
    name: grokbot-solana
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: SETUP_PIN
        sync: false
      - key: WALLET_ENC_JSON
        sync: false
      - key: KEEPALIVE_URL
        sync: false
      - key: DATA_PERSISTENT
        value: "0"
